<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六角形 パス接続 ゲーム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; touch-action: none; }
  canvas { cursor: pointer; }
</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-indigo-300 mb-1">🔷 六角形 パス接続 ゲーム</h1>
  <p class="text-gray-400 text-sm mb-4">同色ノードを線で繋ぎ、全セルを通過させてクリアしよう</p>

  <div class="flex flex-wrap gap-3 mb-4 items-center">
    <button onclick="loadStage('easy')" class="bg-green-700 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm" aria-label="Easyステージを開始">Easy</button>
    <button onclick="loadStage('medium')" class="bg-yellow-700 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg text-sm" aria-label="Mediumステージを開始">Medium</button>
    <button onclick="loadStage('hard')" class="bg-red-700 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm" aria-label="Hardステージを開始">Hard</button>
    <button onclick="undoLast()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm" aria-label="一手戻す">↩ 一手戻す</button>
    <button onclick="clearPaths()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm" aria-label="全パスをクリア">全クリア</button>
    <div id="status-msg" class="text-sm text-gray-400 ml-auto"></div>
  </div>

  <canvas id="hex-canvas" width="540" height="520" class="w-full rounded-xl bg-gray-900 border border-indigo-900"
    aria-label="六角形パスゲームボード"></canvas>

  <div class="mt-3 flex gap-4 text-xs text-gray-400 flex-wrap">
    <span>クリック: 線を描く開始/延長</span>
    <span>同色ノードに到達: 接続完了</span>
    <span>交差すると無効</span>
    <span id="pair-status"></span>
  </div>
</div>

<script>
// Hexagonal grid (offset coordinates, flat-top)
const HEX_SIZE = 36;
const COLS = 7, ROWS = 5;

const COLORS = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7'];
const COLOR_NAMES = ['赤','青','緑','黄','紫'];

// Each stage: nodes = [{row, col, colorIdx}, ...]
const STAGES = {
  easy: {
    grid: {cols:5, rows:4},
    nodes: [
      {r:0,c:0,ci:0},{r:3,c:4,ci:0},
      {r:0,c:4,ci:1},{r:3,c:1,ci:1},
      {r:1,c:2,ci:2},{r:3,c:3,ci:2},
    ]
  },
  medium: {
    grid: {cols:6, rows:5},
    nodes: [
      {r:0,c:0,ci:0},{r:4,c:5,ci:0},
      {r:0,c:5,ci:1},{r:4,c:0,ci:1},
      {r:0,c:3,ci:2},{r:4,c:2,ci:2},
      {r:2,c:1,ci:3},{r:2,c:4,ci:3},
    ]
  },
  hard: {
    grid: {cols:7, rows:5},
    nodes: [
      {r:0,c:0,ci:0},{r:4,c:6,ci:0},
      {r:0,c:6,ci:1},{r:4,c:0,ci:1},
      {r:0,c:3,ci:2},{r:4,c:3,ci:2},
      {r:2,c:1,ci:3},{r:2,c:5,ci:3},
      {r:1,c:4,ci:4},{r:3,c:2,ci:4},
    ]
  }
};

let gCols = 5, gRows = 4;
let nodes = [];
let paths = []; // [{colorIdx, cells:[{r,c}], complete}]
let cellOwner = {}; // key 'r,c' -> pathIdx
let drawing = null; // {pathIdx, last:{r,c}}
let stageKey = 'easy';

const canvas = document.getElementById('hex-canvas');
const ctx = canvas.getContext('2d');

function hexCenter(row, col) {
  const w = HEX_SIZE * Math.sqrt(3);
  const h = HEX_SIZE * 2;
  const offsetX = 50;
  const offsetY = 50;
  // pointy-top hex
  const x = offsetX + col * w + (row % 2) * w / 2;
  const y = offsetY + row * h * 0.75;
  return {x, y};
}

function hexPath(cx, cy, size) {
  const path = new Path2D();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    const px = cx + size * Math.cos(angle);
    const py = cy + size * Math.sin(angle);
    i === 0 ? path.moveTo(px, py) : path.lineTo(px, py);
  }
  path.closePath();
  return path;
}

function cellKey(r, c) { return r + ',' + c; }

function nodeAt(r, c) {
  return nodes.find(n => n.r === r && n.c === c);
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  // Draw cells
  for (let r = 0; r < gRows; r++) {
    for (let c = 0; c < gCols; c++) {
      const {x, y} = hexCenter(r, c);
      const p = hexPath(x, y, HEX_SIZE - 2);
      const owner = cellOwner[cellKey(r, c)];
      if (owner !== undefined) {
        ctx.fillStyle = COLORS[paths[owner].ci] + '33';
      } else {
        ctx.fillStyle = '#1e293b';
      }
      ctx.fill(p);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.5;
      ctx.stroke(p);
    }
  }

  // Draw paths
  paths.forEach((path, pi) => {
    if (path.cells.length < 2) return;
    ctx.beginPath();
    ctx.strokeStyle = COLORS[path.ci];
    ctx.lineWidth = path.complete ? 6 : 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    path.cells.forEach((cell, i) => {
      const {x, y} = hexCenter(cell.r, cell.c);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  });

  // Draw nodes
  nodes.forEach(n => {
    const {x, y} = hexCenter(n.r, n.c);
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[n.ci];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  });

  updateStatus();
}

function updateStatus() {
  const total = paths.length;
  const done = paths.filter(p => p.complete).length;
  const totalCells = gCols * gRows;
  const filledCells = Object.keys(cellOwner).length;
  document.getElementById('status-msg').textContent =
    `接続: ${done}/${total}ペア | セル: ${filledCells}/${totalCells}`;

  const pairStatus = document.getElementById('pair-status');
  const statusParts = paths.map((p, i) => {
    const name = COLOR_NAMES[p.ci];
    return `<span style="color:${COLORS[p.ci]}">${name}: ${p.complete ? '✓' : '…'}</span>`;
  });
  pairStatus.innerHTML = statusParts.join(' ');
}

function getHexAt(px, py) {
  for (let r = 0; r < gRows; r++) {
    for (let c = 0; c < gCols; c++) {
      const {x, y} = hexCenter(r, c);
      const dist = Math.sqrt((px - x) ** 2 + (py - y) ** 2);
      if (dist < HEX_SIZE - 2) return {r, c};
    }
  }
  return null;
}

function areHexNeighbors(r1, c1, r2, c2) {
  const dirs_even = [{dr:-1,dc:0},{dr:-1,dc:-1},{dr:0,dc:-1},{dr:1,dc:-1},{dr:1,dc:0},{dr:0,dc:1}];
  const dirs_odd  = [{dr:-1,dc:1},{dr:-1,dc:0},{dr:0,dc:-1},{dr:1,dc:0},{dr:1,dc:1},{dr:0,dc:1}];
  const dirs = (r1 % 2 === 0) ? dirs_even : dirs_odd;
  return dirs.some(d => d.dr + r1 === r2 && d.dc + c1 === c2);
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;
  const hex = getHexAt(px, py);
  if (!hex) return;
  handleHexClick(hex.r, hex.c);
  draw();
});

function handleHexClick(r, c) {
  const key = cellKey(r, c);
  const n = nodeAt(r, c);

  if (!drawing) {
    // Start drawing from a node
    if (!n) return;
    // Find or create path for this color
    const existingPath = paths.findIndex(p => p.ci === n.ci && !p.complete);
    if (existingPath >= 0) {
      // Continue from end of existing path
      const path = paths[existingPath];
      const last = path.cells[path.cells.length - 1];
      // Clear path if clicking start again
      if (last.r === n.r && last.c === n.c) {
        // Remove path
        path.cells.forEach(cell => delete cellOwner[cellKey(cell.r, cell.c)]);
        paths.splice(existingPath, 1);
        return;
      }
      const first = path.cells[0];
      if (first.r === n.r && first.c === n.c) {
        // Restart from beginning - reverse if needed
        path.cells.forEach(cell => delete cellOwner[cellKey(cell.r, cell.c)]);
        paths.splice(existingPath, 1);
        const newPath = {ci: n.ci, cells: [{r, c}], complete: false};
        paths.push(newPath);
        cellOwner[key] = paths.length - 1;
        drawing = {pathIdx: paths.length - 1, last: {r, c}};
        return;
      }
    }
    // Create new path
    // Remove any old path of same color
    const oldIdx = paths.findIndex(p => p.ci === n.ci);
    if (oldIdx >= 0) {
      paths[oldIdx].cells.forEach(cell => delete cellOwner[cellKey(cell.r, cell.c)]);
      paths.splice(oldIdx, 1);
      // Rebuild cellOwner indices
      rebuildCellOwner();
    }
    const newPath = {ci: n.ci, cells: [{r, c}], complete: false};
    paths.push(newPath);
    cellOwner[key] = paths.length - 1;
    drawing = {pathIdx: paths.length - 1, last: {r, c}};
  } else {
    const path = paths[drawing.pathIdx];
    const last = drawing.last;

    // Can't go to already-used cell (unless it's end node)
    const targetNode = nodeAt(r, c);
    if (cellOwner[key] !== undefined && cellOwner[key] !== drawing.pathIdx) {
      // Flash invalid
      flashInvalid();
      return;
    }

    // Must be neighbor
    if (!areHexNeighbors(last.r, last.c, r, c)) {
      drawing = null;
      return;
    }

    // Check if path already contains this cell (backtrack)
    const existingIdx = path.cells.findIndex(cell => cell.r === r && cell.c === c);
    if (existingIdx >= 0) {
      // Backtrack
      const removed = path.cells.splice(existingIdx + 1);
      removed.forEach(cell => delete cellOwner[cellKey(cell.r, cell.c)]);
      drawing.last = path.cells[path.cells.length - 1];
      return;
    }

    // Add cell
    path.cells.push({r, c});
    cellOwner[key] = drawing.pathIdx;
    drawing.last = {r, c};

    // Check completion
    if (targetNode && targetNode.ci === path.ci && path.cells.length > 1) {
      path.complete = true;
      drawing = null;
      checkWin();
    } else if (targetNode && targetNode.ci !== path.ci) {
      flashInvalid();
      path.cells.pop();
      delete cellOwner[key];
      drawing.last = last;
    }
  }
}

function rebuildCellOwner() {
  cellOwner = {};
  paths.forEach((path, pi) => {
    path.cells.forEach(cell => { cellOwner[cellKey(cell.r, cell.c)] = pi; });
  });
}

function flashInvalid() {
  canvas.style.borderColor = '#ef4444';
  setTimeout(() => { canvas.style.borderColor = '#312e81'; }, 400);
}

function checkWin() {
  const allComplete = paths.length > 0 && paths.every(p => p.complete);
  const totalCells = gCols * gRows;
  const filledCells = Object.keys(cellOwner).length;
  if (allComplete && filledCells === totalCells) {
    setTimeout(() => {
      document.getElementById('status-msg').textContent = '🎉 クリア！全ペア接続・全セル埋め完了！';
    }, 100);
  } else if (allComplete) {
    document.getElementById('status-msg').textContent = '✅ 全ペア接続済み（残' + (totalCells - filledCells) + 'セル）';
  }
}

function undoLast() {
  if (!drawing) {
    // Remove last complete path
    const lastComplete = paths.slice().reverse().find(p => p.complete);
    if (lastComplete) {
      lastComplete.complete = false;
      const last = lastComplete.cells.pop();
      if (last) delete cellOwner[cellKey(last.r, last.c)];
      const pi = paths.indexOf(lastComplete);
      drawing = {pathIdx: pi, last: lastComplete.cells[lastComplete.cells.length - 1]};
    }
  } else {
    const path = paths[drawing.pathIdx];
    if (path.cells.length > 1) {
      const removed = path.cells.pop();
      delete cellOwner[cellKey(removed.r, removed.c)];
      drawing.last = path.cells[path.cells.length - 1];
    } else {
      path.cells.forEach(cell => delete cellOwner[cellKey(cell.r, cell.c)]);
      paths.splice(drawing.pathIdx, 1);
      rebuildCellOwner();
      drawing = null;
    }
  }
  draw();
}

function clearPaths() {
  paths = [];
  cellOwner = {};
  drawing = null;
  draw();
}

function loadStage(key) {
  stageKey = key;
  const stage = STAGES[key];
  gCols = stage.grid.cols;
  gRows = stage.grid.rows;
  nodes = stage.nodes.map(n => ({...n}));
  paths = [];
  cellOwner = {};
  drawing = null;
  draw();
}

loadStage('easy');
</script>
</body>
</html>
